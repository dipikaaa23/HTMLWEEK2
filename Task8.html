<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>My Media Hub</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
        rel="stylesheet">

    <style>

        h1 {
            font-family: "Roboto", sans-serif;
        }

    </style>

</head>

<body>

    <h1>My Media Hub</h1>


    <!-- YouTube Video -->
    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/UB1O30fR-EE"
        title="YouTube video"
        frameborder="0"
        allowfullscreen>
    </iframe>


    <!-- Local Video -->
    <h2>Local Video</h2>

    <video controls width="600">

        <source
            src="media/video.mp4"
            type="video/mp4">

        <source
            src="media/video.webm"
            type="video/webm">

        Your browser does not support the video element.

    </video>


    <!-- Local Audio -->
    <h2>Local Audio</h2>

    <audio controls>

        <source
            src="media/audio.mp3"
            type="audio/mpeg">

        Your browser does not support the audio element.

    </audio>


    <!-- Google Map -->
    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur%20Nepal&output=embed"
        width="600"
        height="450"
        style="border:0;"
        loading="lazy">
    </iframe>


    <!-- External Webpage -->
    <h2>External Webpage</h2>

    <iframe
        src="https://example.com"
        width="600"
        height="400"
        title="External webpage">
    </iframe>


    <!-- PDF Document -->
    <h2>PDF Document</h2>

    <embed
        src="documents/sample.pdf"
        type="application/pdf"
        width="600"
        height="500">


</body>

</html>
